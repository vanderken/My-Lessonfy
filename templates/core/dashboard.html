<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Lessonfy</title>
</head>
<body>
  <h1>Dashboard</h1>
  <p>Logged in as {{ user.email }}</p>

  <h2>Your lessons</h2>
  {% if lessons %}
    <ul>
      {% for lesson in lessons %}
        <li>{{ lesson.title }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No lessons yet.</p>
  {% endif %}

  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Log out</button>
  </form>
</body>
</html>
