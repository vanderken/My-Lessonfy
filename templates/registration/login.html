<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Lessonfy</title>
</head>
<body>
  <h1>Log in</h1>

  <form method="post">
    {% csrf_token %}

    {% if form.non_field_errors %}
      <ul>
        {% for error in form.non_field_errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <p>
      <label for="{{ form.username.id_for_label }}">Email</label><br>
      {{ form.username }}
    </p>

    <p>
      <label for="{{ form.password.id_for_label }}">Password</label><br>
      {{ form.password }}
    </p>

    <button type="submit">Log in</button>
  </form>

  <p><a href="{% url 'register' %}">Create an account</a></p>
</body>
</html>
